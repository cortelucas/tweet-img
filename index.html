<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tweet → Imagem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="panel">
    <h2>Dados</h2>
    <label>Nome <input id="name" value="Lucas S. Corte"></label>
    <label>@usuário <input id="handle" value="olucascorte"></label>
    <div class="field">
      <span class="field-title">Avatar</span>
      <label class="upload">
        <input id="avatar" type="file" accept="image/*" hidden>
        <img class="thumb" alt="" hidden>
        <span class="upload-text">Clique ou arraste a imagem</span>
      </label>
    </div>
    <label>Texto <textarea id="text" rows="8"></textarea></label>
    <div class="field">
      <span class="field-title">Foto do post</span>
      <label class="upload">
        <input id="photo" type="file" accept="image/*" hidden>
        <img class="thumb" alt="" hidden>
        <span class="upload-text">Clique, arraste ou cole (Ctrl+V)</span>
      </label>
    </div>
    <label>Formato da foto
      <select id="ratio">
        <option value="1 / 1">Quadrada</option>
        <option value="4 / 3">4:3</option>
        <option value="16 / 9">16:9</option>
      </select>
    </label>
    <label>Data <input id="datetime"></label>
    <div class="field">
      <span class="field-title">Interações (opcional)</span>
      <div class="grid-2">
        <input id="replies" placeholder="Respostas">
        <input id="reposts" placeholder="Reposts">
        <input id="likes" placeholder="Curtidas">
        <input id="views" placeholder="Visualizações">
      </div>
      <label class="check">
        <input id="iconsOnly" type="checkbox"> Mostrar só os ícones (sem números)
      </label>
    </div>
    <label>Tema
      <select id="theme">
        <option value="light">Claro</option>
        <option value="dim">Escuro (Dim)</option>
        <option value="dark">Escuro (Preto)</option>
      </select>
    </label>
    <label>Marca d'água <input id="watermark" value="@olucascorte"></label>
    <button id="download">Baixar PNG 1080×1080</button>
    <button id="reset" class="secondary">Limpar dados salvos</button>
  </aside>

  <main class="preview-wrap">
    <div id="stage-holder">
    <div id="stage" data-theme="light">
      <article class="tweet">
        <header>
          <img id="p-avatar" class="avatar" alt="">
          <div class="who">
            <strong id="p-name"></strong>
            <span id="p-handle"></span>
          </div>
          <svg class="x-logo" viewBox="0 0 24 24"><path d="M18.9 2H22l-7.2 8.2L23 22h-6.6l-5.2-6.8L5.2 22H2l7.7-8.8L1.6 2h6.8l4.7 6.2L18.9 2zm-1.2 18h1.8L7.4 3.9H5.5L17.7 20z"/></svg>
        </header>
        <p id="p-text"></p>
        <img id="p-photo" class="photo" alt="">
        <footer id="p-datetime"></footer>
        <div id="p-stats" class="stats" hidden>
          <span class="stat" id="s-replies" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.1A8.4 8.4 0 1 1 21 11.5z"/></svg><span id="p-replies"></span></span>
          <span class="stat" id="s-reposts" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span id="p-reposts"></span></span>
          <span class="stat" id="s-likes" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></svg><span id="p-likes"></span></span>
          <span class="stat" id="s-views" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg><span id="p-views"></span></span>
        </div>
      </article>
      <span id="p-watermark" class="watermark"></span>
    </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
